version: '3.8'

services:
  # 1. データベース (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: worknity-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: worknity
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: worknity_user
      MYSQL_PASSWORD: worknity_password
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - worknity-network
    restart: always

  # 2. データベース閲覧ツール (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: worknity-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - worknity-network
    restart: always

  # 3. バックエンドAPI実行環境 (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worknity-backend
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - worknity-network
    restart: always

  # 4. バックエンド用Webサーバー (Nginx)
  web:
    image: nginx:alpine
    container_name: worknity-web
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - worknity-network
    restart: always

  # 5. フロントエンド開発環境 (Node.js)
  frontend:
    build:
      context: ./apps/main-app
      dockerfile: Dockerfile
    container_name: worknity-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/main-app:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - worknity-network
    restart: always

networks:
  worknity-network:
    driver: bridge

volumes:
  db_data:
    driver: local
